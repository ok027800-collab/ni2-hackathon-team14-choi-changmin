<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>비나세이프</title>
<style>
  :root {
    --bg: #f5f7fa; --card: #ffffff; --text: #1f2933; --sub: #62707d;
    --primary: #2b6cb0; --primary-dark: #1e4e82; --line: #d9e0e7;
    --warn-bg: #fff8e1; --warn-line: #f0b429; --warn-text: #7a5200;
    --danger-bg: #fdecea; --danger-line: #d93025; --danger-text: #9b1c14;
    --ok-bg: #e6f6ec; --ok-line: #2f9e5b; --ok-text: #1b6b3a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    line-height: 1.55;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px; }
  header h1 { font-size: 1.35rem; margin: 4px 0 2px; }
  header p { margin: 0 0 12px; color: var(--sub); font-size: .92rem; }
  .sample-note {
    background: #eef3f9; border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 12px; font-size: .85rem; color: var(--sub); margin-bottom: 14px;
  }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
  label.field { display: block; font-weight: 700; font-size: .95rem; margin-bottom: 6px; }
  select, textarea {
    width: 100%; font: inherit; font-size: 16px; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--text);
  }
  textarea { resize: vertical; min-height: 76px; }
  select:focus, textarea:focus, button:focus-visible { outline: 3px solid #90b8e8; outline-offset: 1px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .tab {
    flex: 1; padding: 12px 8px; font: inherit; font-weight: 700; cursor: pointer;
    border: 1px solid var(--line); background: #fff; border-radius: 10px; color: var(--sub);
  }
  .tab[aria-selected="true"] { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn {
    font: inherit; font-weight: 700; cursor: pointer; border: none; border-radius: 8px;
    padding: 12px 18px; background: var(--primary); color: #fff; min-height: 44px;
  }
  .btn:hover:not(:disabled) { background: var(--primary-dark); }
  .btn:disabled { background: #b7c3d0; cursor: not-allowed; }
  .btn.full { width: 100%; margin-top: 10px; }
  .faq-title { font-size: .85rem; color: var(--sub); margin: 14px 0 6px; }
  .faq { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    font: inherit; font-size: .9rem; cursor: pointer; padding: 8px 12px; min-height: 40px;
    border: 1px solid var(--primary); color: var(--primary); background: #fff; border-radius: 999px;
  }
  .chip:hover { background: #eaf2fb; }
  .banner { border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; font-weight: 700; border: 2px solid; }
  .banner.danger { background: var(--danger-bg); border-color: var(--danger-line); color: var(--danger-text); }
  .banner.warn { background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn-text); }
  .banner.info { background: #eef3f9; border-color: var(--line); color: var(--sub); font-weight: 400; }
  .answer { margin: 0 0 12px; padding: 0; list-style: none; }
  .answer li { padding: 6px 0 6px 22px; position: relative; font-size: 1.02rem; }
  .answer li::before { content: "•"; position: absolute; left: 6px; color: var(--primary); font-weight: 700; }
  .src-title { font-weight: 700; font-size: .9rem; margin: 14px 0 6px; }
  .src { border: 1px solid var(--line); border-left: 4px solid var(--primary); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; background: #fafcfe; }
  .src .name { font-weight: 700; font-size: .92rem; }
  .src .clause { color: var(--sub); font-size: .85rem; }
  .src blockquote { margin: 6px 0 0; font-size: .92rem; color: #333; }
  .rate { display: flex; align-items: center; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .rate span { font-size: .9rem; color: var(--sub); }
  .rate button {
    font-size: 1.1rem; cursor: pointer; border: 1px solid var(--line); background: #fff;
    border-radius: 8px; padding: 6px 14px; min-height: 44px;
  }
  .rate button[aria-pressed="true"] { background: #e3effc; border-color: var(--primary); }
  .rate .thanks { color: var(--ok-text); }
  .check-item { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; background: #fff; }
  .check-item input { width: 22px; height: 22px; margin-top: 2px; flex-shrink: 0; }
  .check-item.done { background: var(--ok-bg); border-color: var(--ok-line); }
  .check-item .t { font-weight: 700; }
  .check-item .s { font-size: .82rem; color: var(--sub); margin-top: 2px; }
  .ready { text-align: center; font-weight: 700; font-size: 1.1rem; padding: 14px; border-radius: 10px; background: var(--ok-bg); border: 2px solid var(--ok-line); color: var(--ok-text); margin-top: 10px; }
  .progress { font-size: .9rem; color: var(--sub); margin-bottom: 8px; }
  .hidden { display: none !important; }
  footer { text-align: center; color: var(--sub); font-size: .8rem; padding: 10px 0 24px; }
  @media (max-width: 480px) {
    .wrap { padding: 12px; }
    header h1 { font-size: 1.2rem; }
    .btn.full-m { width: 100%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="appName">비나세이프</h1>
    <p>신입 작업자를 위한 공정 Q&amp;A · 안전 체크리스트</p>
  </header>
  <div class="sample-note">시제품입니다. 공정명과 문서는 모두 <b>샘플 데이터</b>이며 실제 규정이 아닙니다. 실제 작업은 반드시 담당자와 사내 문서를 확인하세요.</div>

  <div class="card">
    <label class="field" for="process">공정 선택</label>
    <select id="process">
      <option>전체</option>
      <option>전극 코팅</option>
      <option>셀 조립</option>
      <option>충방전·내전압 시험</option>
      <option>품질검사(QC)</option>
    </select>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-qa" aria-selected="true" aria-controls="panel-qa">Q&amp;A</button>
    <button class="tab" role="tab" id="tab-check" aria-selected="false" aria-controls="panel-check">안전 체크리스트</button>
  </div>

  <!-- 기능 1: Q&A -->
  <section id="panel-qa" role="tabpanel" aria-labelledby="tab-qa">
    <div class="card">
      <label class="field" for="question">궁금한 것을 입력하세요</label>
      <textarea id="question" placeholder="예) 내전압 시험 중 이상한 냄새가 나면 어떻게 해요?"></textarea>
      <button class="btn full" id="askBtn" disabled>질문하기</button>
      <div class="faq-title">자주 묻는 질문</div>
      <div class="faq" id="faq"></div>
    </div>
    <div id="result" class="card hidden" aria-live="polite"></div>
  </section>

  <!-- 기능 2: 안전 체크리스트 -->
  <section id="panel-check" role="tabpanel" aria-labelledby="tab-check" class="hidden">
    <div class="card" id="checkCard"></div>
  </section>

  <footer>로그인 · 결제 · 서버 없이 브라우저에서만 동작합니다.</footer>
</div>

<script>
(function () {
  "use strict";

  /* ===== 설정 ===== */
  var APP_NAME = "비나세이프";
  var EMERGENCY_WORDS = ["냄새", "연기", "발열", "스파크", "누액", "화재", "부상"];
  var FAQS = ["극성을 반대로 연결했으면?", "충방전 시간은 왜 지켜야 해?", "필수 보호구는?"];
  var DOMAIN_WORDS = ["공정", "시험", "극성", "전압", "보호구", "충방전", "코팅", "조립", "검사", "qc", "안전",
    "장갑", "보안경", "정전기", "냄새", "연기", "발열", "스파크", "누액", "화재", "부상", "전극", "셀",
    "교정", "계측기", "용제", "작업", "절연", "시간", "착용", "연결", "배터리"];

  /* ===== 샘플 문서 (실제 규정 아님) ===== */
  var DOCS = [
    { id: 1, process: "충방전·내전압 시험", doc: "충방전·내전압 시험 안전수칙(샘플)", clause: "제3조",
      excerpt: "시험 전 극성 표시를 확인하고 정격 전압을 확인한 뒤 시험을 시작한다.",
      summary: "시험 시작 전에 극성 표시와 정격 전압을 먼저 확인하세요.",
      triggers: ["극성확인", "극성표시", "정격전압", "시험전확인", "시작전확인", "시험시작전", "시험전에"] },
    { id: 2, process: "충방전·내전압 시험", doc: "충방전·내전압 시험 안전수칙(샘플)", clause: "제4조",
      excerpt: "작업자는 절연장갑, 보안경, 두건, 정전기 방지 밴드를 착용한다.",
      summary: "절연장갑, 보안경, 두건, 정전기 방지 밴드를 착용하세요.",
      triggers: ["보호구", "장갑", "보안경", "두건", "밴드", "착용"] },
    { id: 3, process: "충방전·내전압 시험", doc: "충방전·내전압 시험 안전수칙(샘플)", clause: "제5조",
      excerpt: "충방전 시간은 지정된 시간을 준수한다.",
      summary: "충방전 시간은 지정된 시간을 지켜야 합니다. 이유에 대한 설명은 문서에 없으니 담당자에게 확인하세요.",
      triggers: ["충방전시간", "시간을지", "시간준수", "시간은왜"] },
    { id: 4, process: "충방전·내전압 시험", doc: "충방전·내전압 시험 안전수칙(샘플)", clause: "제8조",
      excerpt: "이상한 냄새, 연기가 발생하면 즉시 시험을 중단하고 담당자에게 보고한다.",
      summary: "즉시 시험을 중단하고 담당자에게 보고하세요.",
      triggers: ["냄새", "연기"] },
    { id: 5, process: "전극 코팅", doc: "전극 코팅 작업 안전수칙(샘플)", clause: "제2조",
      excerpt: "코팅 작업 전 용제 취급 보호구(보안경, 방독 마스크, 내화학 장갑)를 착용한다.",
      summary: "코팅 작업 전에 보안경, 방독 마스크, 내화학 장갑을 착용하세요.",
      triggers: ["보호구", "장갑", "보안경", "마스크", "용제", "착용"] },
    { id: 6, process: "셀 조립", doc: "셀 조립 작업 안전수칙(샘플)", clause: "제2조",
      excerpt: "조립실 입실 전 정전기 방지 복장과 정전기 방지 밴드를 착용한다.",
      summary: "조립실에 들어가기 전에 정전기 방지 복장과 밴드를 착용하세요.",
      triggers: ["보호구", "정전기", "밴드", "복장", "입실", "조립실", "착용"] },
    { id: 7, process: "품질검사(QC)", doc: "품질검사(QC) 작업 지침(샘플)", clause: "제2조",
      excerpt: "검사 시작 전 계측기 교정 상태 표시를 확인한다.",
      summary: "검사를 시작하기 전에 계측기의 교정 상태 표시를 확인하세요.",
      triggers: ["계측기", "교정", "검사시작", "검사전"] }
  ];

  /* ===== 샘플 체크리스트 ===== */
  function d(id) { return DOCS.filter(function (x) { return x.id === id; })[0]; }
  var CHECKLISTS = {
    "충방전·내전압 시험": [
      { text: "극성 확인", doc: d(1) },
      { text: "정격 전압 확인", doc: d(1) },
      { text: "절연장갑·보안경·두건·정전기 방지 밴드 착용", doc: d(2) },
      { text: "충방전 시간 준수", doc: d(3) }
    ],
    "전극 코팅": [{ text: "용제 취급 보호구(보안경·방독 마스크·내화학 장갑) 착용", doc: d(5) }],
    "셀 조립": [{ text: "정전기 방지 복장·밴드 착용", doc: d(6) }],
    "품질검사(QC)": [{ text: "계측기 교정 상태 확인", doc: d(7) }]
  };

  /* ===== 요소 ===== */
  var $ = function (id) { return document.getElementById(id); };
  var processEl = $("process"), qEl = $("question"), askBtn = $("askBtn"), resultEl = $("result");
  var checkState = {}; // 공정별 체크 상태

  document.title = APP_NAME;
  $("appName").textContent = APP_NAME;

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function norm(s) { return s.toLowerCase().replace(/[\s?？!.,~]/g, ""); }

  /* ===== askBot: 목(mock) 응답 엔진. 나중에 실제 LLM 호출로 교체 ===== */
  function askBot(process, question) {
    var q = norm(question);
    var emergency = EMERGENCY_WORDS.some(function (w) { return q.indexOf(w) >= 0; });
    var notice = emergency ? "즉시 작업을 멈추고 담당자에게 알리세요" : "";

    var inScope = DOMAIN_WORDS.some(function (w) { return q.indexOf(w) >= 0; });
    if (!inScope) {
      return { status: "OUT_OF_SCOPE", emergency: false, emergency_notice: "", answer: [],
        warning: "업무 관련 질문만 답할 수 있어요. 공정, 안전, 보호구 등에 대해 물어보세요.", sources: [] };
    }

    var pool = DOCS.filter(function (x) { return process === "전체" || x.process === process; });
    var hits = pool.filter(function (x) {
      return x.triggers.some(function (t) { return q.indexOf(t) >= 0; });
    });
    // 이상 징후 질문이면 비상 조치 문서를 우선
    if (emergency) {
      var em = hits.filter(function (x) { return x.id === 4; });
      if (em.length) hits = em;
    }
    // 보호구 질문처럼 공정마다 다른 경우: "착용" 같은 일반 단어만 걸린 문서는 보호구 문서로 한정
    hits = hits.slice(0, 3);

    if (!hits.length) {
      return { status: "NEEDS_CONFIRMATION", emergency: emergency, emergency_notice: notice, answer: [],
        warning: "근거 문서를 찾지 못했습니다. 담당자 확인 필요", sources: [] };
    }
    var answer = hits.map(function (x) {
      return (process === "전체" ? "[" + x.process + "] " : "") + x.summary;
    });
    if (process === "전체" && new Set(hits.map(function (x) { return x.process; })).size > 1) {
      answer = answer.slice(0, 3);
    }
    return {
      status: "OK", emergency: emergency, emergency_notice: notice, answer: answer.slice(0, 3), warning: "",
      sources: hits.map(function (x) { return { doc_name: x.doc, clause: x.clause, excerpt: x.excerpt }; })
    };
  }

  /* ===== Q&A 화면 ===== */
  function renderResult(question, process, r) {
    resultEl.className = "card";
    resultEl.textContent = "";

    if (r.emergency) resultEl.appendChild(el("div", "banner danger", "⚠ " + r.emergency_notice));
    if (r.status === "NEEDS_CONFIRMATION") resultEl.appendChild(el("div", "banner warn", "⚠ " + r.warning));
    if (r.status === "OUT_OF_SCOPE") resultEl.appendChild(el("div", "banner info", r.warning));

    if (r.status === "OK") {
      var ul = el("ul", "answer");
      r.answer.forEach(function (line) { ul.appendChild(el("li", "", line)); });
      resultEl.appendChild(ul);

      resultEl.appendChild(el("div", "src-title", "근거 문서"));
      r.sources.forEach(function (s) {
        var c = el("div", "src");
        c.appendChild(el("div", "name", s.doc_name));
        c.appendChild(el("div", "clause", s.clause));
        c.appendChild(el("blockquote", "", "“" + s.excerpt + "”"));
        resultEl.appendChild(c);
      });
    }
    if (r.status !== "OUT_OF_SCOPE") {
      var rate = el("div", "rate");
      rate.appendChild(el("span", "", "도움이 됐나요?"));
      var up = el("button", "", "👍"), down = el("button", "", "👎");
      up.setAttribute("aria-pressed", "false"); down.setAttribute("aria-pressed", "false");
      up.setAttribute("aria-label", "도움이 됐어요"); down.setAttribute("aria-label", "도움이 안 됐어요");
      var thanks = el("span", "thanks", "");
      function vote(v, btn, other) {
        btn.setAttribute("aria-pressed", "true"); other.setAttribute("aria-pressed", "false");
        thanks.textContent = "의견이 저장됐어요. 고맙습니다.";
        saveLog({ time: new Date().toISOString(), process: process, question: question,
          status: r.status, answer: r.answer.join(" / "), rating: v });
      }
      up.onclick = function () { vote("up", up, down); };
      down.onclick = function () { vote("down", down, up); };
      rate.appendChild(up); rate.appendChild(down); rate.appendChild(thanks);
      resultEl.appendChild(rate);
    }
    resultEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }
  function saveLog(entry) {
    try {
      var key = "kkumiho_feedback";
      var list = JSON.parse(localStorage.getItem(key) || "[]");
      list.push(entry);
      localStorage.setItem(key, JSON.stringify(list.slice(-200)));
    } catch (e) { /* 저장 불가 환경에서도 앱은 계속 동작 */ }
  }
  function ask(text) {
    var question = text.trim();
    if (!question) return;
    var process = processEl.value;
    renderResult(question, process, askBot(process, question));
  }

  FAQS.forEach(function (f) {
    var b = el("button", "chip", f);
    b.type = "button";
    b.onclick = function () { qEl.value = f; askBtn.disabled = false; ask(f); };
    $("faq").appendChild(b);
  });
  qEl.addEventListener("input", function () { askBtn.disabled = !qEl.value.trim(); });
  qEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey) && qEl.value.trim()) ask(qEl.value);
  });
  askBtn.onclick = function () { ask(qEl.value); };

  /* ===== 안전 체크리스트 화면 ===== */
  function renderChecklist() {
    var card = $("checkCard");
    card.textContent = "";
    var p = processEl.value;
    var items = CHECKLISTS[p];
    if (p === "전체" || !items) {
      card.appendChild(el("div", "banner info", "공정을 먼저 선택해주세요. 위의 '공정 선택'에서 공정을 고르면 작업 전 확인 항목이 나와요."));
      return;
    }
    if (!checkState[p]) checkState[p] = items.map(function () { return false; });
    var state = checkState[p];

    card.appendChild(el("div", "field", p + " 작업 전 확인"));
    var prog = el("div", "progress", "");
    card.appendChild(prog);
    var list = el("div", "");
    var ready = el("div", "ready hidden", "✅ 작업 준비 완료");
    ready.setAttribute("role", "status");

    function update() {
      var n = state.filter(Boolean).length;
      prog.textContent = n + " / " + items.length + " 확인";
      ready.classList.toggle("hidden", n !== items.length);
    }
    items.forEach(function (it, i) {
      var row = el("label", "check-item" + (state[i] ? " done" : ""));
      var cb = document.createElement("input");
      cb.type = "checkbox"; cb.checked = state[i];
      cb.onchange = function () {
        state[i] = cb.checked;
        row.classList.toggle("done", cb.checked);
        update();
      };
      var box = el("div", "");
      box.appendChild(el("div", "t", (i + 1) + ". " + it.text));
      box.appendChild(el("div", "s", "근거: " + it.doc.doc + " " + it.doc.clause + " — “" + it.doc.excerpt + "”"));
      row.appendChild(cb); row.appendChild(box);
      list.appendChild(row);
    });
    card.appendChild(list);
    card.appendChild(ready);
    update();
  }

  /* ===== 탭 / 공정 변경 ===== */
  function showTab(name) {
    var qa = name === "qa";
    $("tab-qa").setAttribute("aria-selected", qa);
    $("tab-check").setAttribute("aria-selected", !qa);
    $("panel-qa").classList.toggle("hidden", !qa);
    $("panel-check").classList.toggle("hidden", qa);
    if (!qa) renderChecklist();
  }
  $("tab-qa").onclick = function () { showTab("qa"); };
  $("tab-check").onclick = function () { showTab("check"); };
  processEl.addEventListener("change", function () {
    resultEl.className = "card hidden";
    if (!$("panel-check").classList.contains("hidden")) renderChecklist();
  });
})();
</script>
</body>
</html>
